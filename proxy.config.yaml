# Proxy wiring. The code of conduct says what is forbidden; this says which
# tool traffic corresponds to which domain named in those clauses.

coc: coc.yaml
user: christian@example.com        # stdio only. Ignored over HTTP: identity comes from the token.

# Serving over streamable HTTP (`--transport streamable-http`) REQUIRES auth.
# Production: validate JWTs from your IdP. `public_key`/`jwks_url` may use ${ENV}.
# auth:
#   mode: jwt
#   issuer: https://login.example.com/
#   audience: https://aggrete.internal.example.com/mcp
#   jwks_url: https://login.example.com/.well-known/jwks.json   # default: <issuer>/.well-known/jwks.json
#   required_scopes: [mcp]
#   identity_claim: email          # default order: email, preferred_username, sub
#   resource_url: https://aggrete.internal.example.com/mcp      # publishes RFC 9728 metadata
# No identity provider yet: built-in sign-in (OAuth server inside the proxy; Claude and Cursor
# register themselves and send people to /signin). Passcodes from the environment.
# auth:
#   mode: builtin
#   issuer: https://mcp.example.com
#   users: {alice@example.com: "${ALICE_PASSCODE}"}
#   state: /var/lib/aggrete/signin.json
# Development: fixed tokens.
# auth:
#   mode: static
#   tokens:
#     dev-token-alice: {subject: alice@example.com}
# Shared state across replicas (required for more than one instance):
# store:
#   redis_url: ${REDIS_URL}
# http:
#   allowed_hosts: [aggrete.internal.example.com]
#   session_idle_timeout: 1800
audit_log: audit.jsonl

# Ship each audit row to a SIEM as it is written (best-effort, off the hot path).
# The local hash-chained log stays the system of record. URL/header values may
# use ${ENV} so tokens stay out of the file.
# audit_forward:
#   http:
#     url: "https://http-inputs.example.splunkcloud.com/services/collector/raw"
#     headers: {Authorization: "Splunk ${HEC_TOKEN}"}
#   # or, instead of http:
#   # syslog: {host: siem.internal, port: 514, proto: udp}
#   # or any OpenTelemetry collector (OTLP/HTTP JSON logs):
#   # otlp: {endpoint: "http://otel-collector:4318/v1/logs", headers: {x-api-key: "${OTEL_KEY}"}}

# Adapter mode (HTTP): serve decisions to a gateway you already run, at
# POST /v1/decide, /access/v1/evaluation (AuthZEN) and /adapters/docker/*.
# The gateway presents `token` as a bearer. See docs/ADAPTERS.md.
# adapters:
#   token: "${ADAPTER_TOKEN}"
#   enabled: true

# Operations (HTTP mode): /healthz, /readyz and Prometheus /metrics are served
# unauthenticated by default. Require a bearer token on /metrics, or turn it off.
# metrics:
#   token: "${METRICS_TOKEN}"
#   enabled: true

# What assistants show for this connector (name and logo in the connect dialog).
# Advertised in the MCP handshake so a client (or the Glama inspector) can show a
# newcomer what this is and what to try. Read by aggrete 0.5.4 and newer.
instructions: >
  This is a live demo of Aggrete, an open-source policy proxy, running in front of
  mock HR, finance, ops and corp connectors for a sample company. Aggrete checks
  every tool call against a code of conduct and refuses or redacts anything that
  would cross a line. New here? Call aggrete__scenarios for a menu of things to try,
  each showing a different kind of decision (redaction, a forbidden combination,
  individual pay, comparing colleagues, the prompt-injection shield, hidden tools).
  Or call aggrete__check with a list of tool calls to ask whether they would be
  allowed, and why, without fetching anything. Run your own at https://aggrete.com/guide

# Menu returned by the built-in `scenarios` tool. Per-deployment, so it names the
# tools this instance exposes. `{user}` is replaced with the caller. Omit it and
# `scenarios` just points people at `check`.
scenarios: |
  Things to try. Each shows Aggrete making a different kind of decision. Run the
  tool calls for real, or preview any of them with aggrete__check (nothing is fetched).

  1. Redaction. Call hr__leave_balance with any email. The email comes back masked;
     the policy still ran on the original.

  2. A combination the code of conduct forbids. Call hr__recent_joiners, then
     finance__budget_roles, then ops__oncall_draft for the same team. Combining
     personnel, budget and rota to profile people is refused (COC-HR-004).

  3. Individual pay. Call finance__pay_band for a small category (try 'executives').
     Figures describing fewer than ten people are individual pay and are refused
     (COC-HR-031). A large category (try 'engineering') is fine.

  4. Comparing colleagues. Call hr__timecard for your own email ({user}), then for a
     colleague's. Putting your record next to a colleague's to compare is refused
     (COC-HR-021).

  5. The prompt-injection shield. Call corp__read_public_post (untrusted web content),
     then try corp__post_note. Once a session has read untrusted content it may not
     write out; the write is refused (COC-SEC-002). Post first and it is allowed.

  6. Tools you cannot even see. Some tools are hidden from you entirely. Run
     aggrete__check with ["corp__restructuring_plan"] or ["corp__secret"] to see why
     (an embargo wall, and a blocked secret store).

  7. Ask before you act. aggrete__check takes a list of tool calls and tells you the
     decision, the rule, and the fix, without running anything.

brand:
  title: Aggrete
  website_url: https://aggrete.com
  icon_url: https://mcp.aggrete.com/icon.svg   # advertised in the MCP handshake
  icon_file: brand-icon.svg                      # served at /icon.svg and /favicon.ico
  icon_mime: image/svg+xml
audit_entities: true    # record which people appeared in each result (needed for policy replay and inference distance)

# Mask secrets and PII in results before they reach the model. Enforcement still
# runs on the original text; only the returned payload is masked, and each hit is
# counted in the audit line. Use `true` for the default set, or list rule names:
# email, ssn, credit_card, aws_key, api_key, bearer, ip.
redact: [email, ssn, credit_card, aws_key, api_key, bearer]

# Tool integrity. Fingerprint every upstream tool the first time it is seen
# (trust on first use, pins persisted to this file) and flag any later change to
# its description or schema (a rug pull), plus scan descriptions for hidden
# instructions (tool poisoning). `on_change`/`on_poison` are `alert` (listed but
# audited) or `block` (hidden and refused). Remove this block to turn it off.
tool_integrity:
  pins: /tmp/aggrete-tool-pins.json
  on_change: alert
  on_poison: block
  scan_poison: true

# Per-user rate limit: at most `max_calls` tool calls per `window` (a fixed
# window; suffixes s/m/h/d). A denial-of-wallet and abuse ceiling, shared across
# replicas when a Redis `store:` is configured. Built-in tools (check, scenarios)
# are exempt. Remove to turn it off.
rate_limit:
  max_calls: 120
  window: 1m

# Human-in-the-loop. Rules with `action: approve` hold the call here until an
# approver grants it (aggrete approve <id>, POST /approvals/<id>/approve, or the
# console). State lives in this file, or in Redis when `store:` is set.
# approvals:
#   file: approvals.json
#   ttl: 4h
#   approvers: [security@example.com]     # plus each rule's own `owner`
#   wait: 0                               # seconds to hold the call open for a quick decision (max 45)
#   notify: {webhook: "${SLACK_WEBHOOK}"} # or command: [/opt/aggrete/notify.sh]

# Inbound secret scanning: scan tool arguments for credential-shaped strings
# before they are forwarded upstream. `true` uses the credential set
# (aws_key, api_key, bearer); or list rule names. `scan_inbound_action` is
# `block` (refuse the call, the default) or `redact` (mask, then forward).
scan_inbound: true
scan_inbound_action: block

upstreams:
  hr:
    command: python3
    args: [demo/mock_server.py, --profile, hr]
  finance:
    command: python3
    args: [demo/mock_server.py, --profile, finance]
  ops:
    command: python3
    args: [demo/mock_server.py, --profile, ops]
  corp:
    command: python3
    args: [demo/mock_server.py, --profile, corp]
  # Remote connector over streamable HTTP. Header values may use ${ENV_VAR};
  # the proxy holds the upstream credential, the end user never does.
  # ops:
  #   url: https://mcp.example.com/ops/mcp
  #   headers:
  #     Authorization: "Bearer ${OPS_MCP_TOKEN}"
  # On-behalf-of: each caller reaches this upstream with their own credential,
  # resolved per request, so the upstream sees the actual person. See the
  # "Per-user access" section in the README.
  # drive:
  #   command: python3
  #   args: [-m, aggrete.connectors.drive, --credentials, /opt/aggrete/sa.json, --root, Northwind]
  #   per_user: true
  #   obo:
  #     command: [/opt/aggrete/obo.sh]   # prints {"env": {...}} or {"headers": {...}}
  #     # users: {sam@corp: {env: {GOOGLE_DELEGATED_USER: sam@corp}}}   # or a static map

# Tool name (upstream__tool) -> domain used by coc.yaml rules.
# Order matters: first match wins.
domains:
  "finance__headcount_plan": finance-planning
  "finance__pay_band": pay-aggregates
  "finance__*": finance-comp
  "hr__timecard": timesheets
  "hr__*": hr-personnel
  "ops__*": ops-rota
  "corp__read_public_post": untrusted-web
  "corp__post_note": shared-notes
  "corp__restructuring_plan": restructuring-plan
  "corp__secret": secrets-store
  # "drive__*": timesheets   # example: Google Drive connector holding team timesheets

default_domain: unclassified

# Which tools act on the world (write / egress). These are governed as writes:
# any write after reading untrusted content is refused (prompt-injection shield),
# and rules can target writes only with `applies: write`. Defaults cover the
# common verbs; override to fit your connectors.
write_tools:
  - "*create*"
  - "*update*"
  - "*write*"
  - "*upload*"
  - "*delete*"
  - "*post*"
  - "*send*"
  - "*share*"

# Layer 1 substitute: tools that are never exposed at all.
deny_tools:
  - "*__export_all*"
