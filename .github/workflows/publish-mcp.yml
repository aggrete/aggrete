name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry under io.github.aggrete/aggrete.
# OIDC proves the workflow runs in the Aggrete org's repo, which is how the org
# namespace is authorized (the interactive OAuth app cannot grant it).
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC authentication to the registry
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      # On a tag push, sync server.json to the tag version; on manual dispatch,
      # keep the version already committed in server.json.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Wait for the package version on PyPI
        run: |
          VERSION=$(jq -r '.version' server.json)
          echo "waiting for aggrete $VERSION on PyPI (the registry validates it exists)..."
          for i in $(seq 1 30); do
            if curl -sSfL "https://pypi.org/pypi/aggrete/$VERSION/json" >/dev/null 2>&1; then
              echo "aggrete $VERSION is on PyPI"; exit 0
            fi
            sleep 10
          done
          echo "timed out waiting for aggrete $VERSION on PyPI" >&2; exit 1

      - name: Publish server to the MCP Registry
        run: ./mcp-publisher publish
